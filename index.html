<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Reception Seat Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. A name box up top, then a place card that answers "where do I sit". */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --sunk:#F3ECEE; --ink:#2A1420; --muted:#76626C; --line:#E4D8DC;
  --berry:#8E2A5B; --on-berry:#FFFFFF; --chart:#6F7C0E;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A1116; --surface:#251A20; --sunk:#2E2128; --ink:#F4EAEE; --muted:#AC97A1; --line:#3F2E36;
  --berry:#E07FAE; --on-berry:#1A1116; --chart:#CBD94E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1A1116; --surface:#251A20; --sunk:#2E2128; --ink:#F4EAEE; --muted:#AC97A1; --line:#3F2E36;
  --berry:#E07FAE; --on-berry:#1A1116; --chart:#CBD94E; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:24px 72px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance}
h1{font-size:38px;line-height:1.05}
h3{font-size:18px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--chart);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
header{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}

.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.search{width:100%;font-size:20px;padding:14px 16px;border:2px solid var(--berry);border-radius:12px;background:var(--surface);min-width:0}
.search::placeholder{color:var(--muted)}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;min-width:0}
.hit:hover{border-color:var(--berry)}
.hit b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.hit span{color:var(--muted);font-size:14px;text-align:right;flex:none;max-width:50%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--berry)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card-top{padding:22px 18px 18px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;border-bottom:1px dashed var(--line)}
.hello{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.who{font-size:16.5px;font-weight:500;max-width:30ch;text-wrap:balance;margin-bottom:6px}
.tname{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.08;color:var(--berry);text-wrap:balance;overflow-wrap:anywhere}
.seatno{font-size:18px;font-variant-numeric:tabular-nums}
.seatno b{font-family:var(--display);font-size:22px}
.card-sec{padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.card-sec:last-child{border-bottom:0}
.diagram{align-self:center;width:100%;max-width:280px;height:auto}
.mates{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:2px 12px;text-align:center;font-size:15px}
.mates li{justify-content:center;line-height:1.3}
.mates li,.seats li{display:flex;gap:10px;align-items:baseline;padding:4px 0;min-width:0}
.n{width:22px;flex:none;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13.5px}
.nm{min-width:0;overflow-wrap:anywhere}
.me .nm{font-weight:600;color:var(--berry)}
.linkish{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--berry)}

.mapbox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
.mapbox.short{max-height:380px}
.mapbox svg{display:block;width:max(100%,1000px);height:auto}
.tb{cursor:pointer}
.tb.dim{opacity:.4}

#tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;scroll-margin-top:16px}
.tcard.flash{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry)}
.tband{background:var(--tc);color:var(--tct);padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tband h3{min-width:0;overflow-wrap:anywhere}
.tband span{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.seats{list-style:none;margin:0;padding:8px 12px 12px}

.az{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;columns:300px;column-gap:28px}
.az-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);break-inside:avoid;width:100%;border-inline:0;border-top:0;background:none;cursor:pointer;text-align:left}
.az-row b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.az-row span{color:var(--muted);font-size:14px;text-align:right;flex:none;max-width:48%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tc);margin-right:6px}

/* credit line, pinned to the bottom of the screen */
.credit{position:fixed;left:0;right:0;bottom:0;z-index:5;text-align:center;font-size:12px;line-height:1.3;color:var(--muted);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.credit a{color:var(--berry);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.credit a:hover{text-decoration-color:var(--berry)}

/* get to know your table */
.facts{background:var(--sunk)}
.facts h3{font-size:22px}
.fa{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.fa li{padding-left:22px;font-size:17px;overflow-wrap:anywhere}
.fa .lead{color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Reception · October 31</div>
    <h1>Find your seat</h1>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="me" id="tab-me">My seat</button>
    <button class="tab" role="tab" data-tab="tables" id="tab-tables">All tables</button>
    <button class="tab" role="tab" data-tab="az" id="tab-az">Guests A to Z</button>
    <button class="tab" role="tab" data-tab="room" id="tab-room">Room map</button>
  </div>

  <section id="p-me" class="narrow">
    <input class="search" id="q" type="search" placeholder="Type your name" aria-label="Type your name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search">
    <div class="hits" id="hits"></div>
    <div id="result"></div>
  </section>

  <section id="p-tables" hidden><div id="tables"></div></section>
  <section id="p-az" hidden><div class="az" id="az"></div></section>
  <section id="p-room" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="muted small" style="text-align:center">Swipe to move around the room. Tap a table to see who sits there.</div>
    <div class="mapbox" id="roomMap"></div>
  </section>
</div>

<script>
const D={"dims":[1600,1000],"tables":[{"name":"Head table","shape":"head","color":"#A8B820","x":700,"y":500,"rot":90,"seats":["Rebecca Chen","Dennis Mathews"],"facts":[]},{"name":"Table 1","shape":"round","color":"#A8B820","x":325,"y":300,"rot":0,"seats":["Inga Chen","Bonnie Zhang","Phillip Young","Dean Young","Aimee Zhang","Lucy Lu","Michelle Jin","Connie Chen"],"facts":[]},{"name":"Table 18","shape":"round","color":"#1F8A8A","x":325,"y":675,"rot":0,"seats":["Joshua Wilson","Michael Boyland","Justin Zebley","Steviane Sani","Abe Feng","Audrey Mito","Mai Miller","Sal Abukar","Kenneth Jjombwe"],"facts":["speaks Chinese fluently","accidentally went to a k-pop concert with Dennis (pre-Becca, of course)","lives in HOTlanta","currently has Dennis & Becca's dining table"]},{"name":"Table 16","shape":"long","color":"#1F8A8A","x":575,"y":675,"rot":0,"seats":["Titus John","James Isaac","Abi Panikulangara","Sara Panikulangara","Mary Jacob","Mobin Jacob","Genevieve Kurapaty","Steven Kurapaty","Vamsi Guda","Leanza Bethel","Jennifer Johnson","Danny Johnson"],"facts":["is a doctor (bonus - find them all!)","worked at a start-up in DC","plays guitar","is a CPA"]},{"name":"Table 2","shape":"round","color":"#E0A21B","x":325,"y":100,"rot":0,"seats":["Edward Maldonado","Irene Tang","Myra Wong","Niket Todi","Pallavi Todi","Sonia Sajja","Sirena Huang"],"facts":["has a birthday today!"]},{"name":"Table 13","shape":"round","color":"#3257C4","x":925,"y":900,"rot":0,"seats":["Gary Thompson","Nancy Thompson","Matt Phelan","Wendy Phelan","Robert Warner","Myrtle Warner","Keith Smith","Sandra Smith"],"facts":["is a retired Nashville Police Officer","is a die-hard Titans fan","is married to a die-hard Titans fan","plays piano (better than Dennis!)"]},{"name":"Table 15","shape":"round","color":"#E2674B","x":725,"y":900,"rot":0,"seats":["Sam Abraham","Lovely Abraham","Rebecca Dethe","Solomon Dethe","Jaisen Thomas","Bincy Thomas","Asha George","Jacob George","Sarasu Kuruvilla","Annie Ninan"],"facts":[]},{"name":"Table 6","shape":"round","color":"#4FA3D9","x":825,"y":325,"rot":0,"seats":["Grace Yao","Jerin Raj","Binu Raj","Charlie Guo","Ben Paul","Sean Leu","Kelly Leu","Sarah Bae","Michael Yang","Ben Yao"],"facts":["lives in Singapore","met Dennis after winning a 1v1 basketball game","has a massive fridge in their home","daughter is named after Becca's favorite flower!"]},{"name":"Table 5","shape":"round","color":"#D4688F","x":725,"y":100,"rot":0,"seats":["Aaron Coulon","Anh Pham","Michele Lim","Jamie Brandt","Melinda Chen","Kevin Shen","Sara Coulon"],"facts":["has their own postage stamp","went to veterinarian school","is a glaucoma specialist","unfortunately, drives a Tesla and not a Toyota"]},{"name":"Table 7","shape":"round","color":"#5A6B7F","x":925,"y":100,"rot":0,"seats":["Ariella Liang","Susan Thomas","John Thomas","John Edwards","Carol Edwards","Bindu Liang","Wayne Liang","Rohit Liang","Eliana Liang","Isaiah Liang"],"facts":["plays the Cello","learned how football works after watching hours of unsanctioned tv time with Dennis and the Best Man","is an pilot","is a nurse"]},{"name":"Table 8","shape":"long","color":"#A8B820","x":1075,"y":300,"rot":90,"seats":["Mabel Holthusen","Aveline Holthusen","Yuhsin Chen","Belle Lee","Joseph Chen","Jeffrey Chen","Jason Chen","Alan Xie","Stephanie Chen","John Holthusen","Gideon Holthusen","Percival Holthusen"],"facts":[]},{"name":"Table 9","shape":"round","color":"#5B3A8C","x":1075,"y":525,"rot":0,"seats":["Bunei Uei","YeeaMei Chen","Grace Chen","Heng-Chang Chen","Hern-Der Chern","Hsiu-Wen Chen","Jocelyn Wu","David Chen","Shien-Chang Liao","Suh-Ling Chen"],"facts":[]},{"name":"Table 10","shape":"round","color":"#8E2A5B","x":1300,"y":575,"rot":0,"seats":["George Ramapurathu","Leena Ramapurathu","John Bright","Sutha John","Santhi Gladson","Gladson Muthian","Tashia John","Eliana John","Fredrick John"],"facts":[]},{"name":"Table 17","shape":"round","color":"#5DBB93","x":525,"y":900,"rot":0,"seats":["Mohan Ollapally","Elsie Ollapally","Henry Johnson","Carol Johnson","Revi Mathew","Kunjunjamma Mathew","Liby Geevarghese","Sunil Geevarghese","Graham Varghese","Sheeja Varghese"],"facts":[]},{"name":"Table 19","shape":"round","color":"#B8323A","x":325,"y":900,"rot":0,"seats":["Samuel Dethe","Stephen Dethe","Fiona Cherukara","Pravin Cherukara","Sajeev Pothen","Raphael Titus","Priscilla Williams","David Victor","Hannah Varghese"],"facts":[]},{"name":"Table 3","shape":"round","color":"#B5652B","x":525,"y":100,"rot":0,"seats":["Keon Lwin","Maeve Lwin","Nicole Chiu","Alice Chang","Eloise Chang","Pauline Chen","Marsha Kwong","Nathan Kwong","Jamie Ponmattam","Naysoe Lwin"],"facts":["shaved their head in college","has a cool crocheting insta","is Taiwanese American and grew up in Ohio","taught Becca how to make macarons"]},{"name":"Table 4","shape":"long","color":"#C2A878","x":575,"y":325,"rot":180,"seats":["Jason Li","Lucy Richards","Kristyen Tomcik","Vincent Mak","Vanessa Lopez","Katarina Lee","Jung Lee","Matthew Tsao","Brandon Piercy","Jamie Wooding"],"facts":["basically builds nuclear weapons","is the subject of an award winning documentary","is a professional dancer","got married 6 weeks ago!"]},{"name":"Table 11","shape":"round","color":"#55773A","x":1300,"y":775,"rot":0,"seats":["Elizabeth Alexander","Rebecca Alexander","Sarah Alexander","William Alexander","Elizabeth Varghese","Jacob Varghese","Shaji Zachariah","Suja Zachariah","Varghese Alexander","Preethi Alexander"],"facts":[]},{"name":"Table 14","shape":"round","color":"#3A3F8F","x":875,"y":675,"rot":0,"seats":["Abishek Mathews","Aithan Chandy","Rujy Chandy","Jolly Mathews","Simy Mathews John","Manish Thomas John","Christin Bose","Moses Mathews","Ephraim Mathews"],"facts":[]},{"name":"Table 12","shape":"long","color":"#E0A21B","x":1075,"y":750,"rot":90,"seats":["Annie Mathews","Benjamin Mathews","Binu Mathews","Roy Mathews","Prabha George","Prasad George","Rosalie Zachariah","Mathew Zachariah","Sily Mathews","Regi Mathews","Molly Thomas","Victor Thomas"],"facts":[]}],"items":[{"label":"Dance floor","w":260,"h":160,"rot":0,"x":500,"y":500},{"label":"Entrance","w":180,"h":30,"rot":0,"x":1100,"y":25},{"label":"Stage","w":600,"h":240,"rot":270,"x":75,"y":475}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function textOn(hex){const n=parseInt(hex.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return(.2126*c[0]+.7152*c[1]+.0722*c[2])>.36?"#1b0f16":"#ffffff";}

/* people, flattened from the tables */
const P=[];
D.tables.forEach((t,ti)=>t.seats.forEach((name,i)=>{if(name)P.push({name,ti,seat:i+1,key:norm(name)});}));
P.sort((a,b)=>a.name.localeCompare(b.name));
P.forEach((p,i)=>p.i=i);

/* ---------- search ---------- */
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[b.length];}
function search(q){
  const qt=norm(q).split(" ").filter(Boolean);if(!qt.length||qt.join("").length<2)return null;
  const exact=P.filter(p=>{const nt=p.key.split(" ");return qt.every(t=>nt.some(n=>n.startsWith(t)));});
  if(exact.length)return exact;
  return P.filter(p=>{const nt=p.key.split(" ");return qt.every(t=>nt.some(n=>{if(n.startsWith(t))return true;if(t.length<4)return false;const max=t.length>=7?2:1;return lev(t,n)<=max||lev(t,n.slice(0,t.length))<=max;}));});
}

/* ---------- table geometry (matches the planning chart) ---------- */
const ROUND_R=Math.max(40,Math.max(1,...D.tables.filter(t=>t.shape==="round").map(t=>t.seats.length))*5.4);
function geom(shape,n){
  n=Math.max(n,1);const SR=13,pts=[];
  if(shape==="round"){const r=ROUND_R;for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts.push([(r+SR+5)*Math.cos(a),(r+SR+5)*Math.sin(a)]);}return{round:true,r,bw:2*(r+2*SR+6),bh:2*(r+2*SR+6),pts};}
  if(shape==="head"){const w=Math.max(120,n*36),h=50;for(let i=0;i<n;i++)pts.push([-w/2+w*(i+.5)/n,-h/2-SR-5]);return{w,h,pts,bw:w,bh:h+2*(2*SR+6)};}
  const top=Math.ceil(n/2),bot=n-top,w=Math.max(140,top*36),h=64;
  for(let i=0;i<top;i++)pts.push([-w/2+w*(i+.5)/top,-h/2-SR-5]);
  for(let i=0;i<bot;i++)pts.push([-w/2+w*(bot-i-.5)/bot,h/2+SR+5]);
  return{w,h,pts,bw:w,bh:h+2*(2*SR+6)};
}
const bodySVG=(g,col,sw)=>g.round?`<circle r="${g.r}" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="${sw}"/>`:`<rect x="${-g.w/2}" y="${-g.h/2}" width="${g.w}" height="${g.h}" rx="6" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="${sw}"/>`;
function wrap(name,max){const out=[];let cur="";for(const w of name.split(/\s+/)){if(cur&&(cur+" "+w).length>max){out.push(cur);cur=w;}else cur=cur?cur+" "+w:w;}if(cur)out.push(cur);return out;}

/* first + last initial: "Manish Thomas John" -> "MJ" */
function initials(name){const w=String(name).trim().split(/\s+/).filter(Boolean);if(!w.length)return"";return (w[0][0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase();}
/* one table, drawn large, seats marked with initials */
function diagram(t,mySeat){
  const g=geom(t.shape,t.seats.length),pad=8,W=g.bw+2*pad,H=g.bh+2*pad;
  const seats=t.seats.map((name,i)=>{const [x,y]=g.pts[i],me=i+1===mySeat,X=x.toFixed(1);
    if(me)return `<circle cx="${X}" cy="${y.toFixed(1)}" r="17" fill="var(--berry)"/><text x="${X}" y="${(y+4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-berry)">${esc(initials(name))}</text>`;
    return `<circle cx="${X}" cy="${y.toFixed(1)}" r="15" fill="var(--sunk)" stroke="var(--line)" stroke-width="1.5"${name?"":` stroke-dasharray="3 3"`}/>${name?`<text x="${X}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">${esc(initials(name))}</text>`:""}`;}).join("");
  return `<svg class="diagram" viewBox="${-W/2} ${-H/2} ${W} ${H}" role="img" aria-label="${esc(t.name)}${mySeat?`, your seat is number ${mySeat}`:""}" style="font-family:var(--body)">${bodySVG(g,t.color,2.5)}${seats}</svg>`;
}

/* the whole room */
function roomSVG(hiTable,hiSeat){
  const [W,H]=D.dims;
  const items=D.items.map(it=>`<g transform="translate(${it.x} ${it.y}) rotate(${it.rot})"><rect x="${-it.w/2}" y="${-it.h/2}" width="${it.w}" height="${it.h}" rx="4" fill="var(--sunk)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 4"/><g transform="rotate(${-it.rot})"><text y="6" text-anchor="middle" font-size="18" font-weight="600" fill="var(--muted)" letter-spacing="1.5">${esc(it.label.toUpperCase())}</text></g></g>`).join("");
  const tabs=D.tables.map((t,ti)=>{
    const g=geom(t.shape,t.seats.length),hi=ti===hiTable,dim=hiTable!=null&&!hi;
    const seats=t.seats.map((name,i)=>{const [x,y]=g.pts[i],me=hi&&i+1===hiSeat;
      return me?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="15" fill="var(--berry)" stroke="var(--surface)" stroke-width="2"/>`
        :`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${name?t.color:"var(--surface)"}"${name?` fill-opacity=".7"`:` stroke="var(--line)" stroke-width="1.5"`}/>`;}).join("");
    const lines=wrap(t.name,13),y0=-(lines.length-1)*11+7;
    const label=`<g transform="rotate(${-t.rot})"><text text-anchor="middle" font-size="20" font-weight="600" fill="var(--ink)" stroke="var(--surface)" stroke-width="5" stroke-linejoin="round" paint-order="stroke" style="font-family:var(--display)">${lines.map((l,i)=>`<tspan x="0" y="${y0+i*22}">${esc(l)}</tspan>`).join("")}</text></g>`;
    const ring=hi?`<rect x="${-g.bw/2-10}" y="${-g.bh/2-10}" width="${g.bw+20}" height="${g.bh+20}" rx="${g.round?g.bw/2+10:14}" fill="none" stroke="var(--berry)" stroke-width="4"/>`:"";
    return `<g class="tb${dim?" dim":""}" data-t="${ti}" transform="translate(${t.x} ${t.y}) rotate(${t.rot})"><rect x="${-g.bw/2}" y="${-g.bh/2}" width="${g.bw}" height="${g.bh}" fill="transparent"/>${bodySVG(g,t.color,hi?4:2.5)}${seats}${label}${ring}</g>`;}).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of the reception room" style="font-family:var(--body)"><rect x="1" y="1" width="${W-2}" height="${H-2}" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>${items}${tabs}</svg>`;
}
function centerMap(box,ti){const t=D.tables[ti],svg=box.querySelector("svg");if(!svg)return;const [W,H]=D.dims,w=svg.clientWidth,h=svg.clientHeight;
  box.scrollLeft=t.x/W*w-box.clientWidth/2;box.scrollTop=t.y/H*h-box.clientHeight/2;}

/* ---------- views ---------- */
let tab="me",who=null;
function showTab(name){
  tab=name;
  for(const k of ["me","tables","az","room"]){$("p-"+k).hidden=k!==name;$("tab-"+k).setAttribute("aria-selected",k===name);}
  if(name==="room"&&!$("roomMap").firstChild)$("roomMap").innerHTML=roomSVG(null,null);
}
function renderHits(){
  const q=$("q").value,res=search(q);
  if(who!=null){$("hits").innerHTML="";return;}
  if(res===null){$("hits").innerHTML=`<div class="muted small" style="text-align:center">Start typing your first or last name.</div>`;return;}
  if(!res.length){$("hits").innerHTML=`<div class="muted" style="text-align:center">No guest matches "${esc(q.trim())}". Try just your last name, or look through the full list.</div><div class="row"><button class="btn" data-go="az">Guests A to Z</button></div>`;return;}
  $("hits").innerHTML=res.slice(0,12).map(p=>`<button class="hit" data-p="${p.i}"><b>${esc(p.name)}</b><span>${esc(D.tables[p.ti].name)}</span></button>`).join("")+(res.length>12?`<div class="muted small" style="text-align:center">${res.length-12} more. Keep typing to narrow it down.</div>`:"");
}
/* anonymous conversation starters, set per table in the planning chart */
function factsHTML(t){
  const F=Array.isArray(t.facts)?t.facts.filter(Boolean).slice(0,5):[];
  if(!F.length)return "";
  return `<div class="card-sec facts">
      <div class="eyebrow">Get to know your table</div>
      <h3>Someone <em>(or some people)</em> at your table…</h3>
      <ul class="fa">${F.map(f=>`<li><span><span class="lead">…</span>${esc(f)}</span></li>`).join("")}</ul>
      <div class="muted small">Ask around and find out who.</div>
    </div>`;
}
function pick(i){
  who=i;const p=P[i],t=D.tables[p.ti],filled=t.seats.filter(Boolean).length;
  $("q").value=p.name;$("hits").innerHTML="";
  const mates=t.seats.map((name,s)=>name?`<li${s+1===p.seat?' class="me"':""}><span class="nm">${esc(name)}${s+1===p.seat?" (you)":""}</span></li>`:"").join("");
  $("result").innerHTML=`<div class="card">
    <div class="card-top">
      <div class="hello">Ni-Howdy, ${esc(p.name)}!</div>
      <div class="who">We can't wait to celebrate with you tonight! You are seated at:</div>
      <div class="tname">${esc(t.name)}</div>
    </div>
    <div class="card-sec">
      <div class="eyebrow">Your seat at the table</div>
      ${diagram(t,p.seat)}
      <ul class="mates">${mates}</ul>
    </div>
    ${factsHTML(t)}
    <div class="card-sec">
      <div class="eyebrow">Where your table is</div>
      <div class="mapbox short" id="myMap">${roomSVG(p.ti,p.seat)}</div>
      <div class="muted small">Your table is outlined. Swipe the map to look around.</div>
    </div>
    <div class="card-sec"><div class="row"><button class="btn" data-clear="1">Look up someone else</button><button class="btn" data-go="tables">See all tables</button></div></div>
  </div>`;
  showTab("me");
  requestAnimationFrame(()=>{centerMap($("myMap"),p.ti);$("result").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});});
}
function clearPick(){who=null;$("result").innerHTML="";$("q").value="";renderHits();$("q").focus();}
function openTable(ti){
  showTab("tables");const el=$("tc-"+ti);if(!el)return;
  document.querySelectorAll(".tcard.flash").forEach(e=>e.classList.remove("flash"));el.classList.add("flash");
  el.scrollIntoView({block:"center"});
}

$("tables").innerHTML=D.tables.map((t,ti)=>`<article class="tcard" id="tc-${ti}"><div class="tband" style="--tc:${t.color};--tct:${textOn(t.color)}"><h3>${esc(t.name)}</h3><span>${t.seats.filter(Boolean).length} guests</span></div><ul class="seats">${t.seats.map((name,s)=>name?`<li><span class="n">${s+1}</span><button class="linkish nm" data-name="${esc(name)}" data-t="${ti}" data-s="${s+1}">${esc(name)}</button></li>`:"").join("")}</ul></article>`).join("");
$("az").innerHTML=P.map(p=>`<button class="az-row" data-p="${p.i}"><b>${esc(p.name)}</b><span><i class="dot" style="--tc:${D.tables[p.ti].color}"></i>${esc(D.tables[p.ti].name)}</span></button>`).join("");

$("q").addEventListener("input",()=>{if(who!=null){who=null;$("result").innerHTML="";}renderHits();});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=search($("q").value);if(r&&r.length===1)pick(r[0].i);$("q").blur();}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab],[data-p],[data-go],[data-clear],[data-s],.tb");if(!b)return;
  if(b.dataset.tab)showTab(b.dataset.tab);
  else if(b.dataset.p)pick(+b.dataset.p);
  else if(b.dataset.go)showTab(b.dataset.go);
  else if(b.dataset.clear)clearPick();
  else if(b.dataset.s){const p=P.find(x=>x.ti===+b.dataset.t&&x.seat===+b.dataset.s);if(p)pick(p.i);}
  else if(b.classList.contains("tb")&&b.closest("#roomMap"))openTable(+b.dataset.t);
});
showTab("me");renderHits();
</script>
</body>
</html>
